untuk tampilan produk tiga dimensi, dan izin usaha adalah legalitas operasional bukan perlindungan karya, sehingga ketiganya bukan pilihan yang tepat.", "catatan": "Teks stimulus pada halaman sumber (128) mengalami sedikit gangguan bayangan/silau pada foto, sehingga sebagian kalimat pada paragraf kedua dan ketiga direkonstruksi berdasarkan konteks. Disarankan verifikasi ke buku asli untuk kata-per-kata yang sama persis."}, {"nomor": 22, "tipe": "pilihan_ganda", "konteks_bersama_id": "komet_21_25", "teks_soal": "Dalam menyusun proposal untuk perusahaan minuman, Andi dan Bima perlu menjelaskan secara rinci mengenai batasan kerja sama tersebut, termasuk durasi penggunaan karakter Komet, media iklan yang diizinkan, dan skema pembayaran. Penjelasan detail mengenai hal tersebut sebaiknya dituangkan dalam bagian .... (Prediksi TKA 2026)", "opsi": [{"label": "A", "teks": "ruang lingkup dan ketentuan kerja sama"}, {"label": "B", "teks": "profil tim penyusun"}, {"label": "C", "teks": "analisis SWOT"}, {"label": "D", "teks": "latar belakang masalah"}, {"label": "E", "teks": "lampiran portofolio"}], "jawaban_benar": "A", "penjelasan": "Soal ini mengukur pemahaman siswa tentang struktur dan isi sebuah proposal kerja sama atau bisnis. Bagian ruang lingkup dan ketentuan kerja sama (sering disebut juga klausul perjanjian) adalah bagian di mana semua aspek teknis dan legal dari sebuah kerja sama dijelaskan secara rinci. Hal ini mencakup hak penggunaan, batasan, durasi, dan kewajiban finansial untuk memastikan tidak ada kesalahpahaman di antara pihak-pihak yang terlibat. Bagian lain seperti profil tim, analisis SWOT, dan latar belakang memiliki fungsi yang berbeda dalam sebuah proposal."}, {"nomor": 23, "tipe": "tabel_pernyataan", "konteks_bersama_id": "komet_21_25", "teks_soal": "Andi dan Bima tidak memiliki modal dan pengalaman untuk memproduksi merchandise yang diminta oleh para penggemar. Mereka mempertimbangkan beberapa model bisnis untuk memulai usaha merchandise mereka.\nTentukan Logis atau Tidak Logis untuk setiap model bisnis yang dipertimbangkan berikut! (Prediksi TKA 2026)", "kolom_status": ["Logis", "Tidak Logis"], "pernyataan": [{"no": 1, "teks": "Segera mengambil pinjaman dalam jumlah besar untuk membeli ribuan kaos dan menyewa ruko sebagai toko fisik.", "status_benar": "Tidak Logis"}, {"no": 2, "teks": "Menjalankan sistem pre-order (PO), di mana produk hanya akan diproduksi setelah pesanan dan pembayaran terkumpul dari sejumlah pembeli.", "status_benar": "Logis"}, {"no": 3, "teks": "Bekerja sama dengan platform print-on-demand, di mana pihak ketiga yang akan memproduksi dan mengirimkan merchandise setiap kali ada pesanan masuk.", "status_benar": "Logis"}], "penjelasan": [{"no": 1, "teks": "Model bisnis ini membutuhkan modal awal yang sangat besar (produksi massal, sewa tempat) dan memiliki risiko finansial yang sangat tinggi, terutama bagi pemula. Ada risiko besar produk tidak laku dan modal tidak kembali."}, {"no": 2, "teks": "Sistem pre-order adalah model bisnis rendah risiko yang sangat cocok untuk pemula. Modal produksi didapatkan langsung dari pelanggan, sehingga tidak ada risiko kerugian akibat barang yang tidak terjual."}, {"no": 3, "teks": "Model print-on-demand (POD) adalah solusi modern yang menghilangkan kebutuhan modal awal untuk produksi dan penyimpanan barang. Ini memungkinkan mereka untuk fokus pada desain dan pemasaran, sementara produksi dan logistik ditangani oleh mitra, sehingga sangat sesuai dengan kondisi mereka."}]}, {"nomor": 24, "tipe": "tabel_pernyataan", "konteks_bersama_id": "komet_21_25", "teks_soal": "Dalam kerja sama dengan perusahaan minuman, Andi dan Bima harus memastikan hak mereka atas karakter Komet tetap terlindungi.\nTentukan Tepat atau Tidak Tepat untuk setiap tindakan terkait pengelolaan HaKI dalam kerja sama tersebut! (Prediksi TKA 2026)", "kolom_status": ["Tepat", "Tidak Tepat"], "pernyataan": [{"no": 1, "teks": "Menyerahkan seluruh hak kepemilikan karakter Komet kepada perusahaan minuman sebagai syarat utama kerja sama.", "status_benar": "Tidak Tepat"}, {"no": 2, "teks": "Membuat kontrak lisensi yang jelas, yang membatasi penggunaan karakter hanya untuk kampanye iklan selama satu tahun.", "status_benar": "Tepat"}, {"no": 3, "teks": "Mengizinkan perusahaan minuman untuk mengubah desain karakter Komet secara bebas tanpa perlu persetujuan dari Andi.", "status_benar": "Tidak Tepat"}], "penjelasan": [{"no": 1, "teks": "Menyerahkan hak milik (ownership) atas aset intelektual utama adalah keputusan bisnis yang sangat buruk. Ini berarti mereka kehilangan kontrol dan potensi pendapatan di masa depan dari karakter yang mereka ciptakan. Model yang benar adalah lisensi, bukan penjualan aset."}, {"no": 2, "teks": "Kontrak lisensi yang jelas adalah instrumen hukum yang tepat untuk kerja sama semacam ini. Dengan mendefinisikan batasan (media, durasi) secara jelas, Andi dan Bima tetap memegang kendali atas karakter mereka sambil mendapatkan pemasukan."}, {"no": 3, "teks": "Sebagai pencipta, Andi memiliki hak moral atas integritas karyanya. Kontrak harus menyertakan klausul bahwa setiap perubahan desain karakter harus mendapatkan persetujuan tertulis dari pencipta untuk menjaga konsistensi dan kualitas karakter."}]}, {"nomor": 25, "tipe": "multi_select", "konteks_bersama_id": "komet_21_25", "teks_soal": "Mengingat semua peluang (permintaan merchandise, tawaran sponsor) dan tantangan (pembajakan, ketiadaan modal) yang ada, Andi dan Bima perlu mengambil langkah-langkah strategis yang terintegrasi untuk membangun bisnis dari webcomic \"Kisah Komet\".\nManakah langkah-langkah strategis yang harus menjadi prioritas utama mereka? (Pilihlah jawaban yang benar! Jawaban benar lebih dari satu) (Prediksi TKA 2026)", "opsi": [{"id": 1, "teks": "Mendaftarkan Hak Cipta atas \"Kisah Komet\" dan karakternya untuk mendapatkan perlindungan hukum."}, {"id": 2, "teks": "Menghentikan rilis episode mingguan untuk fokus pada penanganan kasus pembajakan."}, {"id": 3, "teks": "Menyusun proposal lisensi yang menarik untuk ditindaklanjuti dengan perusahaan minuman dan calon mitra lainnya."}, {"id": 4, "teks": "Meluncurkan lini merchandise resmi dengan model bisnis rendah risiko seperti pre-order atau print-on-demand."}, {"id": 5, "teks": "Membiarkan saja toko tidak resmi menjual merchandise karena bisa membantu popularitas komik."}], "jawaban_benar": [1, 3, 4], "penjelasan": "Pilihan 1 benar karena perlindungan hukum melalui Hak Cipta adalah fondasi dari semua aktivitas komersialisasi. Tanpa ini, mereka tidak memiliki posisi tawar yang kuat dalam negosiasi atau dalam menindak pembajakan. Pilihan 3 benar karena ini adalah peluang nyata yang harus segera ditindaklanjuti sebagai jalur monetisasi yang potensial. Pilihan 4 benar karena model bisnis rendah risiko memungkinkan mereka memenuhi permintaan penggemar tanpa membutuhkan modal besar di awal. Pilihan 2 tidak tepat karena menghentikan rilis konten justru akan menurunkan engagement dan popularitas yang sudah dibangun. Pilihan 5 tidak tepat karena membiarkan pembajakan berjalan akan merugikan mereka secara finansial dan melemahkan posisi hukum mereka di masa depan."}, {"nomor": 26, "tipe": "pilihan_ganda", "konteks_bersama_id": "donutopia_26_30", "teks_soal": "Menghadapi kekhawatiran akan peniruan gaya kemasan \"Donat Klepon\" (\"Donutopia\"), langkah perlindungan Hak Kekayaan Intelektual (HaKI) yang paling fundamental untuk melindungi identitas dan citra usaha adalah .... (TKA 2025)", "opsi": [{"label": "A", "teks": "mengajukan Hak Paten untuk resep \"Donat Klepon\""}, {"label": "B", "teks": "menggunakan bahan baku yang lebih unik dan khas yang lebih sulit ditiru"}, {"label": "C", "teks": "mendaftarkan nama dan logo \"Donutopia\" sebagai Merek Dagang"}, {"label": "D", "teks": "menurunkan harga jual donat untuk mematikan pesaing"}, {"label": "E", "teks": "segera mengurus sertifikasi Halal untuk semua produk"}], "jawaban_benar": "C", "penjelasan": "Soal ini mengukur penerapan pengetahuan tentang HaKI untuk melindungi identitas bisnis. Masalah utama yang dihadapi adalah peniruan identitas visual dan merek. Merek Dagang (Trademark) adalah bentuk perlindungan hukum yang secara spesifik melindungi nama, logo, atau simbol yang digunakan sebagai identitas komersial suatu usaha. Dengan mendaftarkan Merek Dagang, \"Donutopia\" akan memiliki dasar hukum yang kuat untuk melarang pihak lain menggunakan nama atau logo yang serupa yang dapat membingungkan konsumen. Hak Paten sangat sulit didapatkan untuk resep makanan, sementara pilihan lain tidak secara langsung menyelesaikan masalah peniruan identitas merek.", "catatan": "Teks stimulus untuk soal 26-30 direkonstruksi dari halaman 128 (paragraf pembuka bersama) dan 130-131 (detail per soal); nominal harga dan HPP diverifikasi silang dengan perhitungan pada pembahasan soal 28 dan konsisten."}, {"nomor": 27, "tipe": "pilihan_ganda", "konteks_bersama_id": "donutopia_26_30", "teks_soal": "Tawaran kerja sama dari kafe lokal, di mana kafe akan menjual donat \"Donutopia\" dengan sistem konsinyasi (titip jual), merupakan bagian dari penerapan strategi .... (TKA 2025)", "opsi": [{"label": "A", "teks": "lisensi (licensing)"}, {"label": "B", "teks": "usaha patungan (joint venture)"}, {"label": "C", "teks": "waralaba (franchise)"}, {"label": "D", "teks": "penjualan putus (direct purchase)"}, {"label": "E", "teks": "konsinyasi (consignment)"}], "jawaban_benar": "E", "penjelasan": "Soal ini mengukur pemahaman siswa terhadap istilah-istilah dalam saluran distribusi dan penjualan. Konsinyasi adalah sistem kerja sama penjualan di mana satu pihak (pemilik barang, atau consignor) menitipkan barangnya kepada pihak lain (penjual, atau consignee) untuk dijual. Pembayaran kepada pemilik barang baru dilakukan setelah barang tersebut laku terjual, dan penjual akan mendapatkan komisi sesuai perjanjian. Ini berbeda dengan penjualan putus, di mana penjual membeli barang terlebih dahulu dari produsen sebelum dijual kembali."}, {"nomor": 28, "tipe": "tabel_pernyataan", "konteks_bersama_id": "donutopia_26_30", "teks_soal": "Tim \"Donutopia\" perlu menganalisis profitabilitas tawaran kerja sama konsinyasi dari kafe lokal. Diketahui: Harga Jual = Rp10.000, HPP = Rp6.000, Komisi untuk Kafe = 30% dari Harga Jual.\nBerdasarkan data tersebut, tentukan Benar atau Salah untuk setiap pernyataan analisis keuangan berikut! (TKA 2025)", "kolom_status": ["Benar", "Salah"], "pernyataan": [{"no": 1, "teks": "Besaran komisi dalam rupiah yang akan diterima pihak kafe untuk setiap donat yang terjual adalah Rp3.000.", "status_benar": "Benar"}, {"no": 2, "teks": "Laba bersih yang akan diterima \"Donutopia\" dari setiap donat yang terjual melalui kafe adalah Rp1.000.", "status_benar": "Benar"}, {"no": 3, "teks": "Karena labanya lebih kecil, kerja sama ini sebaiknya langsung ditolak karena merugikan \"Donutopia\".", "status_benar": "Salah"}], "penjelasan": [{"no": 1, "teks": "Komisi Kafe = 30% × Harga Jual = 30% × Rp10.000 = Rp3.000."}, {"no": 2, "teks": "Pendapatan bersih untuk Donutopia = Harga Jual – Komisi Kafe = Rp10.000 – Rp3.000 = Rp7.000. Laba bersih = Pendapatan Bersih – HPP = Rp7.000 – Rp6.000 = Rp1.000."}, {"no": 3, "teks": "Meskipun laba per unitnya lebih kecil (Rp1.000) dibandingkan penjualan langsung (Rp4.000), kerja sama ini tetap menghasilkan keuntungan. Pernyataan bahwa kerja sama ini \"merugikan\" adalah salah. Selain itu, kerja sama ini berpotensi meningkatkan volume penjualan secara signifikan dan memperluas jangkauan pasar sehingga secara total dapat meningkatkan laba keseluruhan usaha."}]}, {"nomor": 29, "tipe": "tabel_pernyataan", "konteks_bersama_id": "donutopia_26_30", "teks_soal": "Sistem penjualan dengan pra-pesan dan pengantaran terbatas menjadi penghambat pertumbuhan \"Donutopia\". Tim tersebut mengevaluasi beberapa solusi untuk mengatasi masalah distribusi ini.\nTentukan Logis atau Tidak Logis untuk setiap solusi distribusi yang mereka pertimbangkan! (TKA 2025)", "kolom_status": ["Logis", "Tidak Logis"], "pernyataan": [{"no": 1, "teks": "Menerima tawaran konsinyasi dari kafe sebagai cara untuk membuka titik distribusi baru tanpa perlu merekrut kurir sendiri.", "status_benar": "Logis"}, {"no": 2, "teks": "Mendaftar sebagai mitra usaha (merchant) pada platform ojek online untuk memungkinkan pengiriman instan ke jangkauan yang lebih luas.", "status_benar": "Logis"}, {"no": 3, "teks": "Menghentikan semua layanan pengantaran dan hanya melayani sistem pengambilan di sekolah untuk menyederhanakan operasi.", "status_benar": "Tidak Logis"}], "penjelasan": [{"no": 1, "teks": "Sistem konsinyasi secara efektif mengubah kafe menjadi \"cabang\" atau titik distribusi. Ini adalah cara yang efisien untuk menjangkau pelanggan di area kafe tersebut tanpa harus menanggung biaya operasional pengantaran."}, {"no": 2, "teks": "Platform ojek online adalah solusi modern yang sangat populer untuk masalah logistik usaha kuliner skala kecil. Ini memungkinkan \"Donutopia\" untuk melayani permintaan on-demand dari area yang jauh lebih luas dengan biaya variabel."}, {"no": 3, "teks": "Menghentikan layanan pengantaran akan semakin mempersempit jangkauan pasar dan memperburuk masalah, bukan menyelesaikannya. Ini adalah langkah mundur yang akan menghambat pertumbuhan usaha."}]}, {"nomor": 30, "tipe": "multi_select", "konteks_bersama_id": "donutopia_26_30", "teks_soal": "Mempertimbangkan semua tantangan (penjualan terbatas, distribusi terbatas) dan peluang (tawaran konsinyasi) yang dihadapi, tim \"Donutopia\" perlu menyusun rencana aksi yang terintegrasi untuk mengembangkan usaha mereka.\nManakah di antara langkah-langkah strategis berikut yang paling komprehensif untuk diterapkan? (Pilihlah jawaban yang benar! Jawaban benar lebih dari satu) (TKA 2025)", "opsi": [{"id": 1, "teks": "Segera mendaftarkan nama dan logo \"Donutopia\" sebagai Merek Dagang untuk mendapatkan perlindungan hukum atas identitas mereka."}, {"id": 2, "teks": "Menerima tawaran konsinyasi dan secara aktif menggunakan kemitraan tersebut sebagai sarana promosi, misalnya dengan menaruh kartu nama atau stiker di kemasan."}, {"id": 3, "teks": "Mengganti bahan baku premium dengan yang lebih murah untuk memperbesar margin keuntungan dari konsinyasi."}, {"id": 4, "teks": "Mengembangkan saluran distribusi baru dengan mendaftar sebagai merchant di aplikasi ojek online."}, {"id": 5, "teks": "Menghentikan penjualan melalui Instagram dan hanya fokus pada konsinyasi di kafe."}], "jawaban_benar": [1, 2, 4], "penjelasan": "Pilihan 1 benar karena perlindungan Merek Dagang adalah langkah fundamental untuk mengatasi masalah peniruan dan membangun aset merek jangka panjang. Pilihan 2 benar karena ini menunjukkan pemikiran strategis; kemitraan konsinyasi tidak hanya dilihat sebagai saluran distribusi, tetapi juga sebagai saluran pemasaran untuk menarik pelanggan baru agar mengenal merek \"Donutopia\" lebih jauh. Pilihan 4 benar karena ini secara langsung mengatasi masalah jangkauan dan membuka sumber pendapatan baru dari pelanggan yang menginginkan pengiriman instan. Pilihan 3 akan merusak proposisi nilai utama mereka, yaitu kualitas premium. Pilihan 5 tidak strategis karena menutup saluran penjualan utama (Instagram) yang telah terbukti berhasil adalah langkah yang kontraproduktif; seharusnya, saluran baru (konsinyasi, ojek online) menjadi pelengkap, bukan pengganti."}]}, "konteks": {"eco_planner_16_20": "Sebuah kelompok siswa SMK bernama \"Eco-Planner\" memulai usaha rintisan yang memproduksi buku agenda (planner) ramah lingkungan. Sampul planner terbuat dari karton daur ulang dan halamannya menggunakan kertas daur ulang. Desainnya dibuat minimalis dan modern untuk menarik target pasar mahasiswa dan pekerja muda yang peduli lingkungan.\n\nProses produksi dilakukan dengan bekerja sama dengan percetakan lokal yang juga menggunakan tinta berbasis kedelai (soy-based ink). Kelompok siswa ini melakukan perakitan akhir dan pengemasan secara mandiri. Penjualan dilakukan melalui media sosial Instagram, sebuah situs web sederhana, serta partisipasi aktif dalam bazar dan acara di sekolah.\n\nSetelah enam bulan berjalan, penjualan cenderung stabil namun tidak mengalami pertumbuhan yang signifikan. Mereka menerima beberapa masukan dari pelanggan, salah satunya adalah sampul planner dianggap terlalu polos. Selain itu, mereka menyadari nama \"Eco-Planner\" bersifat sangat umum dan menemukan ada beberapa toko daring lain yang menggunakan nama serupa, sehingga berpotensi membingungkan calon pembeli. Di sisi lain, biaya produksi yang lebih tinggi karena penggunaan bahan daur ulang dan tinta khusus membuat harga jual planner mereka sedikit lebih mahal dibandingkan planner biasa di pasaran.", "lokal_maju_21_25": "Sekelompok siswa SMK dari jurusan Multimedia dan Manajemen Perkantoran membentuk sebuah agensi jasa digital bernama \"Lokal Maju\". Mereka menawarkan paket jasa pengelolaan media sosial, khususnya untuk Usaha Mikro, Kecil, dan Menengah (UMKM) di kota mereka, seperti kedai kopi, jasa binatu, dan warung makan. Paket jasa seharga Rp750.000 per bulan ini mencakup pembuatan konten (foto produk sederhana dan desain grafis), penjadwalan unggahan setiap hari, serta pengelolaan interaksi dengan pengikut (membalas komentar dan pesan).\n\nTim ini terdiri dari seorang pembuat konten, seorang admin media sosial, dan seorang manajer klien yang juga bertugas mencari klien baru. Aset utama mereka adalah laptop, ponsel pribadi, dan langganan bulanan sebuah aplikasi desain grafis profesional.\n\nSetelah berjalan selama empat bulan dengan tiga klien tetap, mereka menghadapi beberapa tantangan. Klien terbaru mereka, sebuah toko roti, mengeluh karena merasa aktivitas di media sosial belum memberikan dampak langsung pada peningkatan penjualan roti mereka. Di sisi lain, tim \"Lokal Maju\" merasa kesulitan meyakinkan calon klien baru yang masih skeptis terhadap manfaat jasa digital.", "dauran_denim_26_30": "Sekelompok siswa SMK Jurusan Tata Busana dan Pemasaran mendirikan sebuah wirausaha bernama \"Dauran Denim\". Mereka mengolah kembali celana jin bekas atau sisa produksi garmen yang tidak lolos kontrol kualitas menjadi produk fesyen baru seperti tote bag, dompet, dan topi bucket. Setiap produk yang dihasilkan bersifat unik karena corak dan warna bahan jin yang berbeda-beda. Sebagai ciri khas, mereka menambahkan emblem kulit dengan logo \"Dauran Denim\" pada setiap item.\n\nSumber bahan baku utama mereka adalah donasi jin bekas dari lingkungan sekolah dan pembelian jin cacat produksi dalam jumlah besar dari pabrik garmen lokal dengan harga sangat murah. Proses pemotongan dan penjahitan dilakukan oleh para siswa sendiri menggunakan fasilitas mesin jahit di sekolah.\n\nProduk mereka sangat diminati dan seringkali habis terjual di bazar sekolah. Kini, mereka menghadapi beberapa tantangan. Pertama, karena setiap produk unik, proses memotret dan membuat deskripsi untuk setiap item saat menjualnya secara online memakan waktu sangat lama. Kedua, mereka merasa nama \"Dauran Denim\" kurang berkesan dan logo mereka belum dilindungi secara hukum. Ketiga, kapasitas produksi mereka sangat terbatas pada waktu luang para siswa sehingga mereka terpaksa menolak pesanan dalam jumlah besar dari sebuah concept store lokal.", "salad_rina_16_20": "Rina, seorang siswi SMK Jurusan Tata Boga, memulai usaha mandiri bernama \"Salad Sehat by Rina\". Ia menjual paket salad sayur segar dengan tiga varian saus (dressing) orisinal buatannya sendiri, yaitu creamy cheese, roasted sesame, dan spicy lime. Pemasaran utamanya dilakukan melalui status WhatsApp dan akun Instagram pribadinya, dengan sistem pemesanan mingguan dan mengantarkan pesanan sendiri setelah jam pulang sekolah ke rumah pelanggan di sekitar lingkungan tempat tinggalnya. Setelah dua bulan berjalan, usahanya cukup digemari oleh teman-teman dan para guru. Namun, seiring bertambahnya pesanan, beberapa masalah mulai muncul.\n\nPertama, ada keluhan mengenai porsi salad yang tidak konsisten, terkadang porsinya banyak, terkadang sedikit. Kedua, ada pelanggan yang menemukan rambut di dalam produknya. Ketiga, karena keterbatasan waktu dan tenaga untuk mengantar, Rina sering menolak pesanan dari pelanggan potensial yang lokasinya lebih jauh dari area layanannya saat ini.", "komet_21_25": "Andi, seorang siswa SMK jurusan Desain Komunikasi Visual (DKV), dan Bima dari jurusan Pemasaran, berkolaborasi menciptakan sebuah komik web (webcomic) berjudul \"Kisah Komet\". Ceritanya mengisahkan petualangan seekor kucing kurir antarplanet bernama Komet. Mereka merilis satu episode baru setiap minggu secara gratis di sebuah platform webcomic populer.\n\nDalam enam bulan, \"Kisah Komet\" berhasil menarik 50.000 pelanggan tetap dan mendapat rating yang sangat tinggi. Banyak penggemar yang meminta merchandise resmi. Sebuah perusahaan minuman bahkan mengajukan proposal kerja sama untuk menggunakan karakter Komet dalam kampanye iklan mereka.\n\nDi tengah peluang tersebut, mereka menghadapi beberapa tantangan. Pertama, mereka tidak memiliki modal dan pengalaman untuk memproduksi merchandise. Kedua, mereka menemukan beberapa toko daring tanpa izin resmi yang telah menjual kaos dan stiker bergambar karakter Komet yang mirip dengan karya asli mereka.", "donutopia_26_30": "Tim siswa SMK Tata Boga dan Pemasaran mendirikan usaha kuliner \"Donutopia\". Mereka membuat donat gourmet dengan cita rasa lokal yang unik, seperti \"Donat Klepon\" (berisi gula merah cair) dan \"Donat Martabak\" (bertopping keju, cokelat, dan kacang). Mereka sangat mengutamakan kualitas bahan baku premium dan kemasan yang menarik secara visual.\n\nHarga Pokok Produksi (HPP) per donat telah mereka hitung sebesar Rp6.000, dan mereka menjualnya seharga Rp10.000 per buah. Penjualan saat ini menggunakan sistem pra-pesan (pre-order) melalui Instagram, dengan opsi pengambilan atau pengantaran terbatas pada hari Rabu dan Jumat.\n\nUsaha mereka mendapat respons positif, namun beberapa tantangan muncul. Pertama, sistem penjualan yang terbatas menghambat potensi pertumbuhan. Kedua, sebuah kafe lokal tertarik untuk menjual donat mereka dengan sistem konsinyasi, di mana kafe akan meminta komisi sebesar 30% dari harga jual. Ketiga, mereka khawatir jika \"Donutopia\" semakin dikenal luas, ada pihak lain yang akan menirunya."}};
</script>
<script>
(function(){

// ---------- utilities ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function uid(){return 'sesi_'+Date.now()+'_'+Math.floor(Math.random()*1000);}
function esc(s){
  const d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}

// ---------- data prep ----------
const ALL_SOAL = [];
RAW_DATA.prediksi_1.soal.forEach(s => ALL_SOAL.push(Object.assign({}, s, {_set:'1', _uid:'p1-'+s.nomor})));
RAW_DATA.prediksi_2.soal.forEach(s => ALL_SOAL.push(Object.assign({}, s, {_set:'2', _uid:'p2-'+s.nomor})));
const BY_UID = {};
ALL_SOAL.forEach(s => BY_UID[s._uid] = s);

// ---------- storage ----------
const LS_KEY = 'pkwu_sessions_v1';
function loadSessions(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; }
}
function saveSessions(list){
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}
function upsertSession(sess){
  const list = loadSessions();
  const idx = list.findIndex(s=>s.id===sess.id);
  if(idx>=0) list[idx]=sess; else list.unshift(sess);
  saveSessions(list);
}
function getSession(id){
  return loadSessions().find(s=>s.id===id);
}
function deleteSession(id){
  saveSessions(loadSessions().filter(s=>s.id!==id));
}

// ---------- toast ----------
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- app state / router ----------
const app = document.getElementById('app');
const topbar = document.getElementById('topbar');
let current = null; // current session object while quizzing

function setTopbar(visible, done, total){
  topbar.style.display = visible ? 'block' : 'none';
  if(visible){
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('progressLabel').textContent = done+' / '+total;
  }
}

function goHome(){
  current = null;
  setTopbar(false);
  renderHome();
  window.scrollTo(0,0);
}

// ---------- HOME ----------
function renderHome(){
  const sessions = loadSessions();
  const drafts = sessions.filter(s=>!s.finishedAt);
  const done = sessions.filter(s=>s.finishedAt).sort((a,b)=>b.finishedAt-a.finishedAt);

  let html = '';
  html += '<header class="hero"><h1>Latihan Soal TKA PKWU</h1>';
  html += '<p>Bank soal Produk/Projek Kreatif dan Kewirausahaan &mdash; Prediksi 1 &amp; 2. Urutan soal diacak setiap sesi, progres tersimpan otomatis.</p></header>';

  if(drafts.length){
    html += '<div class="section-title">Lanjutkan sesi</div>';
    drafts.forEach(s=>{
      const pct = Math.round(s.order.length ? (s.currentIndex/s.order.length*100) : 0);
      html += '<div class="card draft-card" data-resume="'+s.id+'">'+
        '<div><div>'+esc(setLabel(s.setKey))+'</div>'+
        '<div class="draft-meta">Soal '+(s.currentIndex+1)+' dari '+s.order.length+' &middot; '+fmtDate(s.startedAt)+'</div></div>'+
        '<div class="draft-right"><span class="draft-pct">'+pct+'%</span>'+
        '<div class="draft-bar"><div class="draft-bar-fill" style="width:'+pct+'%"></div></div></div>'+
        '</div>';
    });
  }

  html += '<div class="section-title">Mulai latihan baru</div>';
  html += '<div class="mode-grid">';
  html += modeCard('1', 'Prediksi 1', '30 soal');
  html += modeCard('2', 'Prediksi 2', '30 soal');
  html += '<div class="mode-card wide" data-start="gabungan"><span class="label">Gabungan &mdash; semua soal</span><span class="draft-pct">60 soal</span></div>';
  html += '</div>';

  html += '<div class="section-title">Riwayat</div>';
  if(done.length===0){
    html += '<div class="empty-hint">Belum ada sesi yang selesai.</div>';
  }else{
    html += '<div class="card">';
    done.slice(0,8).forEach(s=>{
      const pct = Math.round(s.score/s.order.length*100);
      const cls = pct>=75?'good':(pct>=50?'mid':'low');
      html += '<div class="history-row" data-review="'+s.id+'">'+
        '<div><div>'+esc(setLabel(s.setKey))+'</div>'+
        '<div class="draft-meta">'+fmtDate(s.finishedAt)+'</div></div>'+
        '<div class="history-score '+cls+'">'+s.score+'/'+s.order.length+'</div>'+
        '</div>';
    });
    html += '</div>';
  }

  html += '<footer class="appfoot">Data soal ditranskripsi dari buku prediksi TKA PKWU &mdash; untuk latihan pribadi.</footer>';

  app.innerHTML = html;

  app.querySelectorAll('[data-resume]').forEach(el=>{
    el.addEventListener('click', ()=> resumeSession(el.getAttribute('data-resume')));
  });
  app.querySelectorAll('[data-start]').forEach(el=>{
    el.addEventListener('click', ()=> startSession(el.getAttribute('data-start')));
  });
  app.querySelectorAll('[data-review]').forEach(el=>{
    el.addEventListener('click', ()=> renderResult(getSession(el.getAttribute('data-review'))));
  });
}

function modeCard(key,title,sub){
  return '<div class="mode-card" data-start="'+key+'"><span class="num">P'+key+'</span><span class="label">'+title+' &middot; '+sub+'</span></div>';
}
function setLabel(key){
  if(key==='1') return 'Prediksi 1';
  if(key==='2') return 'Prediksi 2';
  return 'Gabungan (Prediksi 1 & 2)';
}

// ---------- START / RESUME ----------
function startSession(setKey){
  let pool;
  if(setKey==='1') pool = ALL_SOAL.filter(s=>s._set==='1');
  else if(setKey==='2') pool = ALL_SOAL.filter(s=>s._set==='2');
  else pool = ALL_SOAL;

  const order = shuffle(pool.map(s=>s._uid));
  current = {
    id: uid(),
    setKey: setKey,
    order: order,
    currentIndex: 0,
    answers: {},      // uid -> user answer
    results: {},      // uid -> bool correct
    score: 0,
    startedAt: Date.now(),
    finishedAt: null
  };
  upsertSession(current);
  setTopbar(true, 0, order.length);
  renderQuestion();
  window.scrollTo(0,0);
}

function resumeSession(id){
  current = getSession(id);
  if(!current){ goHome(); return; }
  setTopbar(true, current.currentIndex, current.order.length);
  renderQuestion();
  window.scrollTo(0,0);
}

// ---------- QUIZ ----------
let pendingSelection = null; // holds in-progress (unsubmitted) answer for current soal
let submitted = false;

function renderQuestion(){
  const uidNow = current.order[current.currentIndex];
  const soal = BY_UID[uidNow];
  submitted = current.answers.hasOwnProperty(uidNow);
  pendingSelection = submitted ? current.answers[uidNow] : (soal.tipe==='multi_select' ? [] : (soal.tipe==='tabel_pernyataan' ? {} : null));

  setTopbar(true, current.currentIndex, current.order.length);

  let html = '<div class="quiz-wrap">';
  html += '<div class="qnum">'+String(current.currentIndex+1).padStart(2,'0')+'</div>';
  html += '<div class="qtype-label">'+typeLabel(soal.tipe)+' &middot; '+setLabel(soal._set)+' &middot; Soal No. '+soal.nomor+'</div>';

  if(soal.konteks_bersama_id){
    const ctx = findKonteks(soal);
    if(ctx) html += '<div class="konteks-box">'+esc(ctx)+'</div>';
  }

  html += '<div class="qtext">'+esc(soal.teks_soal)+'</div>';

  html += '<div id="answerArea">'+renderAnswerArea(soal)+'</div>';

  html += '<div id="feedbackArea">'+(submitted ? renderFeedback(soal) : '')+'</div>';

  html += '<div class="btn-row">';
  if(!submitted){
    html += '<button class="btn btn-primary btn-block" id="btnSubmit" disabled>Jawab</button>';
  }else{
    const isLast = current.currentIndex === current.order.length-1;
    html += '<button class="btn btn-primary btn-block" id="btnNext">'+(isLast?'Lihat hasil':'Soal berikutnya')+'</button>';
  }
  html += '</div>';
  html += '<div class="btn-row"><button class="link-btn" id="btnExit">Simpan &amp; kembali ke beranda</button></div>';
  html += '</div>';

  app.innerHTML = html;
  wireAnswerArea(soal);

  const bs = document.getElementById('btnSubmit');
  if(bs) bs.addEventListener('click', submitAnswer);
  const bn = document.getElementById('btnNext');
  if(bn) bn.addEventListener('click', nextQuestion);
  document.getElementById('btnExit').addEventListener('click', ()=>{
    upsertSession(current);
    showToast('Progres tersimpan');
    setTimeout(goHome, 500);
  });

  updateSubmitEnabled(soal);
}

function findKonteks(soal){
  if(!soal.konteks_bersama_id) return null;
  return (RAW_DATA.konteks && RAW_DATA.konteks[soal.konteks_bersama_id]) || null;
}

function typeLabel(tipe){
  if(tipe==='pilihan_ganda') return 'Pilihan ganda';
  if(tipe==='multi_select') return 'Pilihan ganda &middot; jawaban benar lebih dari satu';
  if(tipe==='tabel_pernyataan') return 'Tabel pernyataan';
  return tipe;
}

function renderAnswerArea(soal){
  if(soal.tipe==='pilihan_ganda'){
    let h = '<div class="opsi-list">';
    soal.opsi.forEach(o=>{
      h += '<label class="opsi" data-val="'+o.label+'">'+
        '<input type="radio" name="ans" value="'+o.label+'">'+
        '<span><span class="lab">'+o.label+'.</span>'+esc(o.teks)+'</span></label>';
    });
    h += '</div>';
    return h;
  }
  if(soal.tipe==='multi_select'){
    let h = '<div class="opsi-list">';
    soal.opsi.forEach(o=>{
      h += '<label class="opsi" data-val="'+o.id+'">'+
        '<input type="checkbox" value="'+o.id+'">'+
        '<span>'+esc(o.teks)+'</span></label>';
    });
    h += '</div>';
    return h;
  }
  if(soal.tipe==='tabel_pernyataan'){
    let h = '<table class="pernyataan"><thead><tr><th style="width:36px;">No.</th><th>Pernyataan</th>';
    soal.kolom_status.forEach(c=> h += '<th class="stat-col">'+esc(c)+'</th>');
    h += '</tr></thead><tbody>';
    soal.pernyataan.forEach(p=>{
      h += '<tr data-row="'+p.no+'"><td>'+p.no+'</td><td>'+esc(p.teks)+'</td>';
      soal.kolom_status.forEach(c=>{
        h += '<td class="stat-col"><input type="radio" name="row'+p.no+'" value="'+esc(c)+'"></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    return h;
  }
  return '';
}

function wireAnswerArea(soal){
  if(soal.tipe==='pilihan_ganda'){
    document.querySelectorAll('.opsi').forEach(el=>{
      el.addEventListener('click', ()=>{
        pendingSelection = el.getAttribute('data-val');
        document.querySelectorAll('.opsi').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
        updateSubmitEnabled(soal);
      });
    });
  } else if(soal.tipe==='multi_select'){
    document.querySelectorAll('.opsi').forEach(el=>{
      el.addEventListener('click', (e)=>{
        const cb = el.querySelector('input');
        if(e.target !== cb) cb.checked = !cb.checked;
        const val = parseInt(el.getAttribute('data-val'),10);
        if(cb.checked){
          el.classList.add('selected');
          if(!pendingSelection.includes(val)) pendingSelection.push(val);
        } else {
          el.classList.remove('selected');
          pendingSelection = pendingSelection.filter(v=>v!==val);
        }
        updateSubmitEnabled(soal);
      });
    });
  } else if(soal.tipe==='tabel_pernyataan'){
    document.querySelectorAll('table.pernyataan input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const row = inp.closest('tr').getAttribute('data-row');
        pendingSelection[row] = inp.value;
        updateSubmitEnabled(soal);
      });
    });
  }
}

function updateSubmitEnabled(soal){
  const btn = document.getElementById('btnSubmit');
  if(!btn) return;
  let ok = false;
  if(soal.tipe==='pilihan_ganda') ok = !!pendingSelection;
  else if(soal.tipe==='multi_select') ok = pendingSelection.length>0;
  else if(soal.tipe==='tabel_pernyataan') ok = soal.pernyataan.every(p=>pendingSelection[p.no]);
  btn.disabled = !ok;
}

function isCorrect(soal, ans){
  if(soal.tipe==='pilihan_ganda') return ans===soal.jawaban_benar;
  if(soal.tipe==='multi_select'){
    const a = ans.slice().sort();
    const b = soal.jawaban_benar.slice().sort();
    return a.length===b.length && a.every((v,i)=>v===b[i]);
  }
  if(soal.tipe==='tabel_pernyataan'){
    return soal.pernyataan.every(p=> ans[p.no]===p.status_benar);
  }
  return false;
}

function submitAnswer(){
  const uidNow = current.order[current.currentIndex];
  const soal = BY_UID[uidNow];
  const correct = isCorrect(soal, pendingSelection);

  current.answers[uidNow] = pendingSelection;
  current.results[uidNow] = correct;
  if(correct) current.score++;
  upsertSession(current);

  submitted = true;
  lockAnswerArea(soal, pendingSelection, correct);
  document.getElementById('feedbackArea').innerHTML = renderFeedback(soal);

  const row = document.querySelector('.btn-row');
  row.innerHTML = '<button class="btn btn-primary btn-block" id="btnNext">'+
    (current.currentIndex===current.order.length-1 ? 'Lihat hasil' : 'Soal berikutnya')+'</button>';
  document.getElementById('btnNext').addEventListener('click', nextQuestion);

  document.getElementById('feedbackArea').scrollIntoView({behavior:'smooth', block:'center'});
}

function lockAnswerArea(soal, ans, correctOverall){
  if(soal.tipe==='pilihan_ganda'){
    document.querySelectorAll('.opsi').forEach(el=>{
      const val = el.getAttribute('data-val');
      el.querySelector('input').disabled = true;
      el.style.cursor = 'default';
      if(val===soal.jawaban_benar) el.classList.add('correct');
      else if(val===ans) el.classList.add('wrong');
    });
  } else if(soal.tipe==='multi_select'){
    document.querySelectorAll('.opsi').forEach(el=>{
      const val = parseInt(el.getAttribute('data-val'),10);
      el.querySelector('input').disabled = true;
      el.style.cursor = 'default';
      const shouldBe = soal.jawaban_benar.includes(val);
      const picked = ans.includes(val);
      if(shouldBe) el.classList.add('correct');
      else if(picked) el.classList.add('wrong');
    });
  } else if(soal.tipe==='tabel_pernyataan'){
    document.querySelectorAll('table.pernyataan input').forEach(inp=> inp.disabled = true);
    soal.pernyataan.forEach(p=>{
      const tr = document.querySelector('tr[data-row="'+p.no+'"]');
      if(ans[p.no]===p.status_benar) tr.classList.add('row-correct');
      else tr.classList.add('row-wrong');
    });
  }
}

function renderFeedback(soal){
  const uidNow = current.order[current.currentIndex];
  const ans = current.answers[uidNow];
  const correct = current.results[uidNow];

  let body = '';
  if(soal.tipe==='tabel_pernyataan'){
    body += '<div style="margin-bottom:10px;"><b>Kunci: </b>'+
      soal.pernyataan.map(p=>p.status_benar).join(', ')+'</div>';
    soal.penjelasan.forEach(p=>{
      body += '<div style="margin-bottom:8px;"><b>Pernyataan '+p.no+'.</b> '+esc(p.teks)+'</div>';
    });
  } else {
    if(soal.tipe==='multi_select'){
      const labels = soal.jawaban_benar.map(id=>{
        const o = soal.opsi.find(x=>x.id===id);
        return o ? o.teks : id;
      });
      body += '<div style="margin-bottom:10px;"><b>Jawaban benar: </b>'+esc(labels.join('; '))+'</div>';
    }
    body += '<div>'+esc(soal.penjelasan)+'</div>';
  }

  let html = '<div class="feedback'+(correct?'':' wrong')+'">'+
    '<div class="feedback-title">'+(correct ? 'Benar' : 'Kurang tepat')+'</div>'+
    '<div class="feedback-body">'+body+'</div>';
  if(soal.catatan){
    html += '<div class="feedback-note">Catatan sumber: '+esc(soal.catatan)+'</div>';
  }
  html += '</div>';
  return html;
}

function nextQuestion(){
  if(current.currentIndex < current.order.length-1){
    current.currentIndex++;
    upsertSession(current);
    renderQuestion();
    window.scrollTo(0,0);
  } else {
    current.finishedAt = Date.now();
    upsertSession(current);
    renderResult(current);
    window.scrollTo(0,0);
  }
}

// ---------- RESULT ----------
function renderResult(sess){
  current = null;
  setTopbar(false);
  const total = sess.order.length;
  const pct = Math.round(sess.score/total*100);

  let html = '<div class="score-hero">';
  html += '<div class="score-num">'+sess.score+'<span style="font-size:0.4em;color:var(--ink-faint);">/'+total+'</span></div>';
  html += '<div class="score-sub">'+setLabel(sess.setKey)+' &middot; '+pct+'% benar &middot; '+fmtDate(sess.finishedAt||sess.startedAt)+'</div>';
  html += '</div>';

  html += '<div class="section-title">Tinjau jawaban</div>';
  sess.order.forEach((uidX, i)=>{
    const soal = BY_UID[uidX];
    const ok = sess.results[uidX];
    html += '<div class="review-item" data-reviewq="'+i+'" data-sess="'+sess.id+'">'+
      '<span class="review-dot '+(ok?'ok':'no')+'"></span>'+
      '<span class="review-num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span style="flex:1;color:var(--ink-muted);">'+esc(soal.teks_soal.slice(0,64))+'&hellip;</span>'+
      '</div>';
  });

  html += '<div class="btn-row" style="margin-top:26px;">';
  html += '<button class="btn btn-ghost btn-block" id="btnBackHome">Kembali ke beranda</button>';
  html += '</div>';

  app.innerHTML = html;
  document.getElementById('btnBackHome').addEventListener('click', goHome);
  app.querySelectorAll('[data-reviewq]').forEach(el=>{
    el.addEventListener('click', ()=>{
      reviewSingle(getSession(el.getAttribute('data-sess')), parseInt(el.getAttribute('data-reviewq'),10));
    });
  });
}

function reviewSingle(sess, i){
  const uidX = sess.order[i];
  const soal = BY_UID[uidX];
  const ans = sess.answers[uidX];
  const ok = sess.results[uidX];

  let html = '<div class="quiz-wrap">';
  html += '<button class="link-btn" id="btnBackResult" style="margin-bottom:18px;">&larr; Kembali ke hasil</button>';
  html += '<div class="qnum">'+String(i+1).padStart(2,'0')+'</div>';
  html += '<div class="qtype-label">'+typeLabel(soal.tipe)+' &middot; '+setLabel(soal._set)+' &middot; Soal No. '+soal.nomor+'</div>';
  html += '<div class="qtext">'+esc(soal.teks_soal)+'</div>';
  html += '<div>'+renderAnswerArea(soal)+'</div>';
  app.innerHTML = html;
  lockAnswerArea(soal, ans, ok);
  document.getElementById('feedbackArea') || (()=>{})();
  const fbWrap = document.createElement('div');
  fbWrap.innerHTML = renderFeedback(soal);
  app.querySelector('.quiz-wrap').appendChild(fbWrap.firstChild);

  document.getElementById('btnBackResult').addEventListener('click', ()=> renderResult(sess));
  window.scrollTo(0,0);
}

// ---------- init ----------
goHome();

})();
</script>
</body>
</html>
